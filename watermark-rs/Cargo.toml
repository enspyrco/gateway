[package]
name = "watermark-detection"
version = "0.1.0"
edition = "2021"
description = "Blind watermark detection - Rust port of C++ implementation"

[dependencies]
rustfft = "6.2"
num-complex = "0.4"
num-traits = "0.2"
image = "0.25"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
rand = "0.8"

[[bin]]
name = "detect"
path = "src/bin/detect.rs"

[[bin]]
name = "degrade"
path = "src/bin/degrade.rs"
