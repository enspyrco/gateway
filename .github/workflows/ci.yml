name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
      backend: ${{ steps.filter.outputs.backend }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            flutter:
              - 'flutter/**'
            backend:
              - 'backend/**'
            contracts:
              - 'contracts/**'

  # Required status check — gates on failures AND on unexpected skips.
  # Charge 3.4 fix (UNEMPLOYED.md): previously a skipped Flutter job counted
  # as success, so a README change + Dart compile error would pass CI.
  # Fix: if the changes filter detected flutter/backend/contracts files changed
  # but the corresponding job was skipped (i.e., it never ran), that is a bug
  # in the CI configuration — fail loudly.
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [changes, flutter, backend, contracts]
    if: always()
    steps:
      - name: Check status
        run: |
          FAIL=0

          # Fail on explicit failures
          if [[ "${{ needs.flutter.result }}" == "failure" ]]; then
            echo "Flutter job failed"
            FAIL=1
          fi
          if [[ "${{ needs.backend.result }}" == "failure" ]]; then
            echo "Backend job failed"
            FAIL=1
          fi
          if [[ "${{ needs.contracts.result }}" == "failure" ]]; then
            echo "Contracts job failed"
            FAIL=1
          fi

          # Fail when code changed but the CI job was skipped unexpectedly.
          # A skipped job only makes sense when the path filter says no files changed.
          if [[ "${{ needs.changes.outputs.flutter }}" == "true" ]] && \
             [[ "${{ needs.flutter.result }}" == "skipped" ]]; then
            echo "Flutter files changed but Flutter job was skipped — CI gate is broken"
            FAIL=1
          fi
          if [[ "${{ needs.changes.outputs.backend }}" == "true" ]] && \
             [[ "${{ needs.backend.result }}" == "skipped" ]]; then
            echo "Backend files changed but backend job was skipped — CI gate is broken"
            FAIL=1
          fi
          if [[ "${{ needs.changes.outputs.contracts }}" == "true" ]] && \
             [[ "${{ needs.contracts.result }}" == "skipped" ]]; then
            echo "Contracts files changed but contracts job was skipped — CI gate is broken"
            FAIL=1
          fi

          if [[ $FAIL -eq 1 ]]; then
            exit 1
          fi
          echo "All required checks passed"

  flutter:
    name: Flutter Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze code
        # --no-fatal-infos: infos are informational only, not actionable in CI.
        # --no-fatal-warnings flag removed: all warnings surfaced by the
        # analyzer must be fixed or explicitly inline-ignored with a reason
        # (charge 3.4 fix from UNEMPLOYED.md). Warnings are now fatal.
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  contracts:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat clean && npm run compile

      - name: Run tests
        run: npm test
