<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Void Gallery</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:grab;
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"SF Mono",ui-monospace,monospace}
  body.dragging{cursor:grabbing}
  #title{position:fixed;left:22px;top:18px;color:#3a4a55;opacity:.55;
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;pointer-events:none}
  #hint{position:fixed;left:22px;bottom:20px;color:#9fb6c8;opacity:.8;letter-spacing:.04em;
    pointer-events:none;text-shadow:0 0 12px #1a3a4a}
  #hint b{color:#fff}
  /* provenance card — fades in during CONTEMPLATE as the hidden history surfaces */
  #prov{position:fixed;right:26px;top:50%;width:272px;padding:18px 20px;border-radius:14px;
    transform:translateY(-50%) translateX(16px);
    background:rgba(6,10,14,0.72);border:1px solid rgba(127,208,255,0.14);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    box-shadow:0 0 44px rgba(127,208,255,0.10);color:#9fb6c8;
    opacity:0;pointer-events:none;transition:opacity .9s ease,transform .9s ease}
  #prov.show{opacity:1;transform:translateY(-50%) translateX(0)}
  #prov .pname{color:#dff2ff;font-size:16px;font-weight:600;margin-bottom:13px;
    text-shadow:0 0 18px rgba(127,208,255,.35)}
  #prov .prow{display:flex;justify-content:space-between;gap:12px;padding:6px 0;
    border-top:1px solid rgba(127,208,255,0.07);font-size:12px}
  #prov .pk{color:#4a5a68;text-transform:uppercase;letter-spacing:.16em;font-size:10px;
    align-self:center}
  #prov .pv{color:#bcd4e4;text-align:right}
  #prov .pv.lic{color:#7fd0ff;font-weight:600;text-transform:capitalize}
  #prov .pmark{margin-top:14px;padding-top:12px;border-top:1px solid rgba(127,208,255,0.12);
    font-size:11px;color:#5fb0d0;letter-spacing:.02em;font-family:ui-monospace,monospace;
    min-height:1.4em}
  #prov .pmark.decoding{color:#3a5a68;animation:flick 1.1s steps(2) infinite}
  #prov .pmark b{color:#7fd0ff}
  @keyframes flick{0%,100%{opacity:.35}50%{opacity:.85}}
</style>
</head>
<body>
<div id="title">The Void Gallery</div>
<div id="hint"><b>arrow keys</b>/wasd — wander &nbsp;·&nbsp; <b>drag</b> — look &nbsp;·&nbsp; walk up to a piece and <b>let go</b> — it draws you in</div>

<!-- provenance card: the hidden history that surfaces when the ghost contemplates a piece -->
<div id="prov">
  <div class="pname" id="p-name">—</div>
  <div class="prow"><span class="pk">artist</span><span class="pv" id="p-artist">—</span></div>
  <div class="prow"><span class="pk">minted</span><span class="pv" id="p-minted">—</span></div>
  <div class="prow"><span class="pk">license</span><span class="pv lic" id="p-license">—</span></div>
  <div class="prow"><span class="pk">market</span><span class="pv" id="p-market">—</span></div>
  <div class="pmark" id="p-mark">—</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.04);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.95, 0.7, 0.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// floor
{
  const c=document.createElement('canvas'); c.width=c.height=1024; const g=c.getContext('2d');
  g.fillStyle='#000'; g.fillRect(0,0,1024,1024);
  g.strokeStyle='rgba(80,140,180,0.5)'; g.lineWidth=1.2;
  for(let i=0;i<=32;i++){const p=i/32*1024;
    g.beginPath();g.moveTo(p,0);g.lineTo(p,1024);g.stroke();
    g.beginPath();g.moveTo(0,p);g.lineTo(1024,p);g.stroke();}
  const rg=g.createRadialGradient(512,512,40,512,512,512);
  rg.addColorStop(0,'rgba(0,0,0,0)');rg.addColorStop(1,'rgba(0,0,0,1)');
  g.fillStyle=rg; g.fillRect(0,0,1024,1024);
  const tex=new THREE.CanvasTexture(c); tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.repeat.set(6,6);
  const floor=new THREE.Mesh(new THREE.CircleGeometry(40,64),
    new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:0.2,blending:THREE.AdditiveBlending,depthWrite:false}));
  floor.rotation.x=-Math.PI/2; floor.position.y=0.001; scene.add(floor);
}

// art is script-loaded from the gateway API — real minted, watermarked NFTs
// hung in the void, facing the centre, dim until the ghost draws near.
const frames=[];
const S=2.4; // base frame size (square; scaled to image aspect on load)
function makeArtFrame(pos, url, token){
  const grp=new THREE.Group();
  const h=S, w=S;
  const pts=[[-w/2,-h/2,0],[w/2,-h/2,0],[w/2,h/2,0],[-w/2,h/2,0],[-w/2,-h/2,0]].map(p=>new THREE.Vector3(...p));
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:0xbfe6ff,transparent:true,opacity:0.35,blending:THREE.AdditiveBlending,depthWrite:false}));
  grp.add(line);
  const panelMat=new THREE.MeshBasicMaterial({color:0x222a33,transparent:true,opacity:0.12,depthWrite:false});
  const panel=new THREE.Mesh(new THREE.PlaneGeometry(w,h),panelMat);
  grp.add(panel);
  if(url){
    new THREE.TextureLoader().load(url, tex=>{
      tex.colorSpace=THREE.SRGBColorSpace;
      panelMat.map=tex; panelMat.color.setScalar(1); panelMat.needsUpdate=true;
      const img=tex.image;
      if(img&&img.width&&img.height){ const a=img.width/img.height; panel.scale.x=a; line.scale.x=a; }
    }, undefined, ()=>{/* leave dark panel on error */});
  }
  grp.position.copy(pos);
  grp.lookAt(0, pos.y, 0);            // face the centre where the ghost roams
  grp.userData={line,panel,panelMat,token};
  scene.add(grp); frames.push(grp);
}
async function loadArt(){
  try{
    const g=await (await fetch('/api/gallery')).json();
    const addrs=(g.galleries||[]).map(x=>x.address);
    const toks=[];
    for(const a of addrs){
      const r=await (await fetch('/api/gallery/'+encodeURIComponent(a))).json();
      (r.tokens||[]).forEach(t=>toks.push(t));
    }
    const n=Math.max(toks.length,1);
    toks.forEach((t,i)=>{
      const ang=i/n*Math.PI*2, R=8;
      const pos=new THREE.Vector3(Math.cos(ang)*R, 1.7, Math.sin(ang)*R);
      const url=(t.imageUrl||'').replace(/^https?:\/\/[^/]+/, ''); // -> same-origin /ipfs/...
      makeArtFrame(pos, url, t);
    });
    console.log('void: hung', toks.length, 'artworks');
  }catch(e){ console.warn('void: loadArt failed', e); }
}
loadArt();

// ---------- provenance card: the hidden history surfaces on CONTEMPLATE ----------
// The watermark is invisible, so the ghost you pilot is see-through; the art is
// solid because it HAS provenance. Drawing near makes that hidden history legible
// — the mark decoding from noise is the whole thesis, given a moment of UI.
const prov=document.getElementById('prov');
const $=id=>document.getElementById(id);
const shortAddr=a=>a?a.slice(0,6)+'…'+a.slice(-4):'—';
function fmtDate(iso){ try{ return new Date(iso).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }catch(e){ return '—'; } }
let provToken=null, decodeTimer=null;
function showProvenance(t){
  if(!t || t===provToken) return;          // already showing this piece
  provToken=t;
  $('p-name').textContent   = t.name || ('NFTmarket #'+t.tokenId);
  $('p-artist').textContent = shortAddr(t.creator);
  $('p-minted').textContent = fmtDate(t.mintedAt);
  $('p-license').textContent= t.ownerLicense || '—';
  if(t.isListed){
    const first=(t.listings&&t.listings[0])||{};
    const eth=first.priceEth || (t.listingPrice?(Number(t.listingPrice)/1e18).toFixed(2):'?');
    const more=(t.listings&&t.listings.length>1)?' +'+(t.listings.length-1):'';
    $('p-market').textContent = eth+' ETH · '+(first.licenseType||t.listingLicenseType||'')+more;
  } else { $('p-market').textContent='not for sale'; }
  // the invisible mark becoming legible: noise -> the hidden wallet:tokenId resolves
  const mark=$('p-mark'); mark.classList.add('decoding'); mark.textContent='decoding watermark…';
  clearTimeout(decodeTimer); const captured=t;
  decodeTimer=setTimeout(()=>{
    if(provToken!==captured) return;
    mark.classList.remove('decoding');
    mark.innerHTML='◈ <b>'+shortAddr(captured.creator)+':'+captured.tokenId+'</b> · verified';
  }, 1100);
  prov.classList.add('show');
}
function hideProvenance(){ provToken=null; clearTimeout(decodeTimer); prov.classList.remove('show'); }

// ---------- character: swarm of little white squiggle-strands (unchanged, loved) ----------
const figure = new THREE.Group(); scene.add(figure);
const BALLS = [
  { c:[ 0.00,0.70,0.00], r:0.42, n:320, swing:0,    ph:0,        lift:0    },
  { c:[ 0.00,1.30,0.00], r:0.32, n:210, swing:0,    ph:0,        lift:0    },
  { c:[-0.21,1.52,0.02], r:0.11, n:28,  swing:0,    ph:0,        lift:0    },
  { c:[ 0.21,1.52,0.02], r:0.11, n:28,  swing:0,    ph:0,        lift:0    },
  { c:[ 0.00,1.24,0.26], r:0.12, n:34,  swing:0,    ph:0,        lift:0    },
  { c:[-0.46,0.80,0.00], r:0.17, n:70,  swing:0.14, ph:0,        lift:0    },
  { c:[ 0.46,0.80,0.00], r:0.17, n:70,  swing:0.14, ph:Math.PI,  lift:0    },
  { c:[-0.19,0.16,0.04], r:0.19, n:80,  swing:0.16, ph:Math.PI,  lift:0.06 },
  { c:[ 0.19,0.16,0.04], r:0.19, n:80,  swing:0.16, ph:0,        lift:0.06 },
];
const L=4; const strands=[];
for(const b of BALLS){ for(let i=0;i<b.n;i++){
  const u=Math.random(),v=Math.random(),w=Math.random();
  const theta=2*Math.PI*u,phi=Math.acos(2*v-1),rad=Math.pow(w,0.6)*b.r,sp=Math.sin(phi);
  const lx=rad*sp*Math.cos(theta),ly=rad*Math.cos(phi),lz=rad*sp*Math.sin(theta);
  const dt=2*Math.PI*Math.random(),dp=Math.acos(2*Math.random()-1),dsp=Math.sin(dp);
  strands.push({ball:b,lx,ly,lz,dx:dsp*Math.cos(dt),dy:Math.cos(dp),dz:dsp*Math.sin(dt),
    len:0.07+Math.random()*0.06,seed:Math.random()*1000});
}}
const segPerStrand=L-1, vertCount=strands.length*segPerStrand*2;
const segGeo=new THREE.BufferGeometry();
const segPos=new Float32Array(vertCount*3);
segGeo.setAttribute('position',new THREE.BufferAttribute(segPos,3));
figure.add(new THREE.LineSegments(segGeo,new THREE.LineBasicMaterial({
  color:0xffffff,transparent:true,opacity:0.34,blending:THREE.AdditiveBlending,depthWrite:false})));
const pts=new Array(L); const GAIT=8.0;
function updateFigure(t,moveAmt){
  const FAST=t*6.0, wc=t*GAIT; let o=0;
  for(const s of strands){ const b=s.ball;
    const gz=b.swing?Math.sin(wc+b.ph)*b.swing*moveAmt:0;
    const gy=b.lift?Math.max(0,Math.sin(wc+b.ph))*b.lift*moveAmt:0;
    const ax=b.c[0]+s.lx, ay=b.c[1]+s.ly+gy, az=b.c[2]+s.lz+gz;
    for(let i=0;i<L;i++){ const a=(i/(L-1))-0.5, amp=0.028;
      const bx=ax+s.dx*a*s.len, by=ay+s.dy*a*s.len, bz=az+s.dz*a*s.len;
      pts[i]=[bx+Math.sin(FAST+s.seed+i*1.3)*amp, by+Math.cos(FAST*1.07+s.seed*1.7+i)*amp, bz+Math.sin(FAST*0.93+s.seed*0.7+i*2.1)*amp];
    }
    for(let i=0;i<segPerStrand;i++){ const p=pts[i],q=pts[i+1];
      segPos[o++]=p[0];segPos[o++]=p[1];segPos[o++]=p[2];
      segPos[o++]=q[0];segPos[o++]=q[1];segPos[o++]=q[2]; }
  }
  segGeo.attributes.position.needsUpdate=true; segGeo.computeBoundingSphere();
}

// ---------- input ----------
const keys={};
addEventListener('keydown',e=>{ keys[e.code]=true; if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault(); });
addEventListener('keyup',e=>{keys[e.code]=false;});
let azimuth=0.4, elevation=0.5, azVel=0, elVel=0, dragging=false, px=0, py=0;
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;document.body.classList.add('dragging');});
addEventListener('pointerup',()=>{dragging=false;document.body.classList.remove('dragging');});
addEventListener('pointermove',e=>{ if(!dragging)return; const dx=e.clientX-px, dy=e.clientY-py; px=e.clientX; py=e.clientY;
  azVel += -dx*0.011; elVel += -dy*0.011; });   // censer: weighted momentum

// ---------- helpers ----------
function orbit(az,el,rad,t){ return new THREE.Vector3(t.x+Math.sin(az)*Math.cos(el)*rad, t.y+Math.sin(el)*rad, t.z+Math.cos(az)*Math.cos(el)*rad); }
function lerpAngle(a,b,k){ let d=b-a; d=Math.atan2(Math.sin(d),Math.cos(d)); return a+d*k; }
function nearestFrame(p){ let best=null,bd=1e9; for(const f of frames){ const d=f.position.distanceTo(p); if(d<bd){bd=d;best=f;} } return {f:best,d:bd}; }
function viewSpot(f){ // a point in front of the art, between it and the centre where the bear roams
  const n=f.position.clone().setY(0).multiplyScalar(-1).normalize();
  return f.position.clone().setY(0).addScaledVector(n, VIEW_DIST);
}

// ---------- state machine: ROAM -> APPROACH -> CONTEMPLATE ----------
let state='ROAM', target=null, disarmed=null;
const ARM=4.5, VIEW_DIST=3.2;
let camRad=4.6, camEl=0.5;
const charPos=new THREE.Vector3(0,0,0); let charYaw=0;
const lookT=new THREE.Vector3(0,1.1,0);
const up1=new THREE.Vector3(), desired=new THREE.Vector3(), eye=new THREE.Vector3();
const fwd=new THREE.Vector3(), right=new THREE.Vector3(), move=new THREE.Vector3(),
      to=new THREE.Vector3(), fdir=new THREE.Vector3();
const SPEED=2.2; const clock=new THREE.Clock(); let elapsed=0;

function tick(){
  const dt=Math.min(clock.getDelta(),0.05); elapsed+=dt;
  const anyMove = keys.ArrowUp||keys.ArrowDown||keys.ArrowLeft||keys.ArrowRight||keys.KeyW||keys.KeyA||keys.KeyS||keys.KeyD;
  const near=nearestFrame(charPos);

  // --- transitions ---
  if(state==='ROAM'){
    if(disarmed && (near.f!==disarmed || near.d>ARM*1.4)) disarmed=null;          // re-arm once you leave
    if(!anyMove && near.f && near.d<ARM && near.f!==disarmed){ state='APPROACH'; target=near.f; }
  } else if(anyMove){ state='ROAM'; disarmed=target; target=null; }               // any key breaks the spell

  // --- locomotion ---
  fwd.set(Math.sin(azimuth),0,Math.cos(azimuth)).normalize(); right.set(fwd.z,0,-fwd.x);
  let moving=false;
  if(state==='ROAM'){
    move.set(0,0,0);
    if(keys.ArrowUp||keys.KeyW)move.sub(fwd);            // forward = away from camera
    if(keys.ArrowDown||keys.KeyS)move.add(fwd);
    if(keys.ArrowRight||keys.KeyD)move.add(right);
    if(keys.ArrowLeft||keys.KeyA)move.sub(right);
    moving=move.lengthSq()>0;
    if(moving){ move.normalize(); charPos.addScaledVector(move,SPEED*dt);
      charYaw=lerpAngle(charYaw,Math.atan2(move.x,move.z),Math.min(1,dt*9)); }
  } else {                                                // APPROACH/CONTEMPLATE: auto-walk to the art
    const spot=viewSpot(target);
    to.copy(spot).sub(charPos); to.y=0; const dist=to.length();
    if(dist>0.04){ to.normalize(); const step=Math.min(SPEED*dt,dist); charPos.addScaledVector(to,step); moving=step>0.02; }
    charYaw=lerpAngle(charYaw, Math.atan2(target.position.x-charPos.x, target.position.z-charPos.z), Math.min(1,dt*4));
    if(dist<0.12) state='CONTEMPLATE';
  }

  updateFigure(elapsed, moving?1:0);
  figure.position.set(charPos.x, Math.sin(elapsed*1.6)*0.02, charPos.z);
  figure.rotation.y=charYaw; figure.rotation.z=Math.sin(elapsed*8)*0.04*(moving?1:0);

  // --- camera ---
  up1.set(charPos.x, charPos.y+1.0, charPos.z);
  if(state==='ROAM'){
    // censer weighted follow: drag momentum + a slow trail behind movement
    azimuth+=azVel*dt; elevation=Math.min(1.2,Math.max(0.12,elevation+elVel*dt));
    azVel-=azVel*Math.min(1,dt*1.3); elVel-=elVel*Math.min(1,dt*1.3);
    if(moving){ azimuth=lerpAngle(azimuth, Math.atan2(-move.x,-move.z), Math.min(1,dt*0.9)); }
    camEl+=(elevation-camEl)*Math.min(1,dt*3); camRad+=(4.6-camRad)*Math.min(1,dt*3);
    lookT.lerp(up1, Math.min(1,dt*4));
    desired.copy(orbit(azimuth,camEl,camRad,lookT));
    camera.position.lerp(desired, Math.min(1,dt*2.2));   // weighty
    camera.lookAt(lookT);
  } else {
    // glide forward THROUGH the bear to first-person at the eyes, looking at the art
    fdir.set(Math.sin(charYaw),0,Math.cos(charYaw));
    eye.set(charPos.x, charPos.y+1.45, charPos.z).addScaledVector(fdir,0.16);
    camera.position.lerp(eye, Math.min(1, dt*(state==='CONTEMPLATE'?3.2:2.2)));
    lookT.lerp(target.position, Math.min(1,dt*2.4));
    camera.lookAt(lookT);
  }

  // art emerges from the dark as the bear nears it
  for(const f of frames){ const d=f.position.distanceTo(charPos); const g=Math.max(0,Math.min(1,(7-d)/7));
    f.userData.line.material.opacity=0.25+g*0.75;
    f.userData.panelMat.opacity=0.12+g*0.88; }

  // provenance surfaces only once you're contemplating a piece; any key dismisses it
  if(state==='CONTEMPLATE' && target) showProvenance(target.userData.token);
  else if(state==='ROAM') hideProvenance();

  composer.render();
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
