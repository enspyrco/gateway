<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Void Gallery — Camera Shootout</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:grab;
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"SF Mono",ui-monospace,monospace}
  body.dragging{cursor:grabbing}
  #title{position:fixed;left:22px;top:18px;color:#3a4a55;opacity:.55;
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;pointer-events:none}
  #hint{position:fixed;left:22px;bottom:20px;color:#9fb6c8;opacity:.8;letter-spacing:.04em;
    pointer-events:none;text-shadow:0 0 12px #1a3a4a}
  #hint b{color:#fff}
  #panel{position:fixed;right:18px;top:50%;transform:translateY(-50%);width:236px;
    display:flex;flex-direction:column;gap:8px}
  .mode{border:1px solid #16161c;border-radius:10px;padding:11px 13px;background:#06060a;
    color:#6a7a88;cursor:pointer;transition:.18s}
  .mode:hover{border-color:#27323c}
  .mode .k{color:#3a4a55;font-size:11px;float:right}
  .mode .n{color:#aeb8c4;font-weight:600;font-size:13.5px}
  .mode .d{font-size:11.5px;line-height:1.45;margin-top:3px;color:#5a6a78}
  .mode.on{border-color:#7fd0ff;background:#0a131b;box-shadow:0 0 24px rgba(127,208,255,.18)}
  .mode.on .n{color:#dff2ff}
  .mode.on .d{color:#9fc0d4}
  .mode.on .k{color:#7fd0ff}
</style>
</head>
<body>
<div id="title">The Void Gallery · camera shootout</div>
<div id="hint"><b>arrow keys</b>/wasd — walk &nbsp;·&nbsp; <b>drag</b> — look &nbsp;·&nbsp; <b>1–4</b> — switch camera &nbsp;·&nbsp; <b>space</b> — (mode 2) dive</div>
<div id="panel"></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.04);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.95, 0.7, 0.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// floor
{
  const c=document.createElement('canvas'); c.width=c.height=1024; const g=c.getContext('2d');
  g.fillStyle='#000'; g.fillRect(0,0,1024,1024);
  g.strokeStyle='rgba(80,140,180,0.5)'; g.lineWidth=1.2;
  for(let i=0;i<=32;i++){const p=i/32*1024;
    g.beginPath();g.moveTo(p,0);g.lineTo(p,1024);g.stroke();
    g.beginPath();g.moveTo(0,p);g.lineTo(1024,p);g.stroke();}
  const rg=g.createRadialGradient(512,512,40,512,512,512);
  rg.addColorStop(0,'rgba(0,0,0,0)');rg.addColorStop(1,'rgba(0,0,0,1)');
  g.fillStyle=rg; g.fillRect(0,0,1024,1024);
  const tex=new THREE.CanvasTexture(c); tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.repeat.set(6,6);
  const floor=new THREE.Mesh(new THREE.CircleGeometry(40,64),
    new THREE.MeshBasicMaterial({map:tex,transparent:true,opacity:0.2,blending:THREE.AdditiveBlending,depthWrite:false}));
  floor.rotation.x=-Math.PI/2; floor.position.y=0.001; scene.add(floor);
}

// art is script-loaded from the gateway API — real minted, watermarked NFTs
// hung in the void, facing the centre, dim until the ghost draws near.
const frames=[];
const S=2.4; // base frame size (square; scaled to image aspect on load)
function makeArtFrame(pos, url, token){
  const grp=new THREE.Group();
  const h=S, w=S;
  const pts=[[-w/2,-h/2,0],[w/2,-h/2,0],[w/2,h/2,0],[-w/2,h/2,0],[-w/2,-h/2,0]].map(p=>new THREE.Vector3(...p));
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:0xbfe6ff,transparent:true,opacity:0.35,blending:THREE.AdditiveBlending,depthWrite:false}));
  grp.add(line);
  const panelMat=new THREE.MeshBasicMaterial({color:0x222a33,transparent:true,opacity:0.12,depthWrite:false});
  const panel=new THREE.Mesh(new THREE.PlaneGeometry(w,h),panelMat);
  grp.add(panel);
  if(url){
    new THREE.TextureLoader().load(url, tex=>{
      tex.colorSpace=THREE.SRGBColorSpace;
      panelMat.map=tex; panelMat.color.setScalar(1); panelMat.needsUpdate=true;
      const img=tex.image;
      if(img&&img.width&&img.height){ const a=img.width/img.height; panel.scale.x=a; line.scale.x=a; }
    }, undefined, ()=>{/* leave dark panel on error */});
  }
  grp.position.copy(pos);
  grp.lookAt(0, pos.y, 0);            // face the centre where the ghost roams
  grp.userData={line,panel,panelMat,token};
  scene.add(grp); frames.push(grp);
}
async function loadArt(){
  try{
    const g=await (await fetch('/api/gallery')).json();
    const addrs=(g.galleries||[]).map(x=>x.address);
    const toks=[];
    for(const a of addrs){
      const r=await (await fetch('/api/gallery/'+encodeURIComponent(a))).json();
      (r.tokens||[]).forEach(t=>toks.push(t));
    }
    const n=Math.max(toks.length,1);
    toks.forEach((t,i)=>{
      const ang=i/n*Math.PI*2, R=8;
      const pos=new THREE.Vector3(Math.cos(ang)*R, 1.7, Math.sin(ang)*R);
      const url=(t.imageUrl||'').replace(/^https?:\/\/[^/]+/, ''); // -> same-origin /ipfs/...
      makeArtFrame(pos, url, t);
    });
    console.log('void: hung', toks.length, 'artworks');
  }catch(e){ console.warn('void: loadArt failed', e); }
}
loadArt();

// ---------- character: swarm of little white squiggle-strands (unchanged, loved) ----------
const figure = new THREE.Group(); scene.add(figure);
const BALLS = [
  { c:[ 0.00,0.70,0.00], r:0.42, n:320, swing:0,    ph:0,        lift:0    },
  { c:[ 0.00,1.30,0.00], r:0.32, n:210, swing:0,    ph:0,        lift:0    },
  { c:[-0.21,1.52,0.02], r:0.11, n:28,  swing:0,    ph:0,        lift:0    },
  { c:[ 0.21,1.52,0.02], r:0.11, n:28,  swing:0,    ph:0,        lift:0    },
  { c:[ 0.00,1.24,0.26], r:0.12, n:34,  swing:0,    ph:0,        lift:0    },
  { c:[-0.46,0.80,0.00], r:0.17, n:70,  swing:0.14, ph:0,        lift:0    },
  { c:[ 0.46,0.80,0.00], r:0.17, n:70,  swing:0.14, ph:Math.PI,  lift:0    },
  { c:[-0.19,0.16,0.04], r:0.19, n:80,  swing:0.16, ph:Math.PI,  lift:0.06 },
  { c:[ 0.19,0.16,0.04], r:0.19, n:80,  swing:0.16, ph:0,        lift:0.06 },
];
const L=4; const strands=[];
for(const b of BALLS){ for(let i=0;i<b.n;i++){
  const u=Math.random(),v=Math.random(),w=Math.random();
  const theta=2*Math.PI*u,phi=Math.acos(2*v-1),rad=Math.pow(w,0.6)*b.r,sp=Math.sin(phi);
  const lx=rad*sp*Math.cos(theta),ly=rad*Math.cos(phi),lz=rad*sp*Math.sin(theta);
  const dt=2*Math.PI*Math.random(),dp=Math.acos(2*Math.random()-1),dsp=Math.sin(dp);
  strands.push({ball:b,lx,ly,lz,dx:dsp*Math.cos(dt),dy:Math.cos(dp),dz:dsp*Math.sin(dt),
    len:0.07+Math.random()*0.06,seed:Math.random()*1000});
}}
const segPerStrand=L-1, vertCount=strands.length*segPerStrand*2;
const segGeo=new THREE.BufferGeometry();
const segPos=new Float32Array(vertCount*3);
segGeo.setAttribute('position',new THREE.BufferAttribute(segPos,3));
figure.add(new THREE.LineSegments(segGeo,new THREE.LineBasicMaterial({
  color:0xffffff,transparent:true,opacity:0.34,blending:THREE.AdditiveBlending,depthWrite:false})));
const pts=new Array(L); const GAIT=8.0;
function updateFigure(t,moveAmt){
  const FAST=t*6.0, wc=t*GAIT; let o=0;
  for(const s of strands){ const b=s.ball;
    const gz=b.swing?Math.sin(wc+b.ph)*b.swing*moveAmt:0;
    const gy=b.lift?Math.max(0,Math.sin(wc+b.ph))*b.lift*moveAmt:0;
    const ax=b.c[0]+s.lx, ay=b.c[1]+s.ly+gy, az=b.c[2]+s.lz+gz;
    for(let i=0;i<L;i++){ const a=(i/(L-1))-0.5, amp=0.028;
      const bx=ax+s.dx*a*s.len, by=ay+s.dy*a*s.len, bz=az+s.dz*a*s.len;
      pts[i]=[bx+Math.sin(FAST+s.seed+i*1.3)*amp, by+Math.cos(FAST*1.07+s.seed*1.7+i)*amp, bz+Math.sin(FAST*0.93+s.seed*0.7+i*2.1)*amp];
    }
    for(let i=0;i<segPerStrand;i++){ const p=pts[i],q=pts[i+1];
      segPos[o++]=p[0];segPos[o++]=p[1];segPos[o++]=p[2];
      segPos[o++]=q[0];segPos[o++]=q[1];segPos[o++]=q[2]; }
  }
  segGeo.attributes.position.needsUpdate=true; segGeo.computeBoundingSphere();
}

// ---------- input ----------
const keys={};
addEventListener('keydown',e=>{ keys[e.code]=true; if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();
  if(e.code>='Digit1'&&e.code<='Digit4') setMode(+e.code.slice(5)); });
addEventListener('keyup',e=>{keys[e.code]=false;});
let azimuth=0.4, elevation=0.42, azVel=0, elVel=0, dragging=false, px=0, py=0;
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;document.body.classList.add('dragging');});
addEventListener('pointerup',()=>{dragging=false;document.body.classList.remove('dragging');});
addEventListener('pointermove',e=>{ if(!dragging)return; const dx=e.clientX-px, dy=e.clientY-py; px=e.clientX; py=e.clientY;
  if(mode===3){ azVel += -dx*0.012; elVel += -dy*0.012; }           // censer: momentum
  else { azimuth -= dx*0.005; elevation=Math.min(1.35,Math.max(0.08,elevation - dy*0.005)); }
});

// ---------- camera modes ----------
const MODES=[
  {n:'The Curious Eye', d:'Reads your intent: leans in near art, chases low when you walk, rises to a constellation when you pause in open dark.'},
  {n:'Enter the Ghost', d:'Third-person — until you hold SPACE: the camera glides through your transparent body into first-person. Release to step back out.'},
  {n:'The Censer', d:'Weighted orbit. Flick and the camera swings around you and slowly settles, like an incense burner on a chain.'},
  {n:'The Reveal', d:'As you near a frame the camera performs one signature push-in, locking the art centre and sliding you to the thirds.'},
];
let mode=1;
const panel=document.getElementById('panel');
MODES.forEach((m,i)=>{ const el=document.createElement('div'); el.className='mode'; el.dataset.i=i+1;
  el.innerHTML=`<span class="k">${i+1}</span><div class="n">${m.n}</div><div class="d">${m.d}</div>`;
  el.onclick=()=>setMode(i+1); panel.appendChild(el); });
function setMode(m){ mode=m; camRad=4.4; camEl=0.42; azVel=elVel=0;
  [...panel.children].forEach((el,i)=>el.classList.toggle('on', i+1===m)); }

// camera helpers / state
let camRad=4.4, camEl=0.42;
const lookT=new THREE.Vector3();
const _orbit=new THREE.Vector3();
function orbit(az,el,rad,t){ _orbit.set(t.x+Math.sin(az)*Math.cos(el)*rad, t.y+Math.sin(el)*rad, t.z+Math.cos(az)*Math.cos(el)*rad); return _orbit; }
function lerpAngle(a,b,k){ let d=b-a; d=Math.atan2(Math.sin(d),Math.cos(d)); return a+d*k; }
function nearestFrame(p){ let best=null,bd=1e9; for(const f of frames){ const d=f.position.distanceTo(p); if(d<bd){bd=d;best=f;} } return {f:best,d:bd}; }

const charPos=new THREE.Vector3(0,0,0); let charYaw=0;
const up1=new THREE.Vector3(), tmp=new THREE.Vector3(), desired=new THREE.Vector3();
const fwd=new THREE.Vector3(), right=new THREE.Vector3(), move=new THREE.Vector3();
const SPEED=2.2; const clock=new THREE.Clock(); let elapsed=0;
setMode(1);

function tick(){
  const dt=Math.min(clock.getDelta(),0.05); elapsed+=dt;

  // movement
  fwd.set(Math.sin(azimuth),0,Math.cos(azimuth)).normalize(); right.set(fwd.z,0,-fwd.x);
  move.set(0,0,0);
  if(keys.ArrowUp||keys.KeyW)move.add(fwd);
  if(keys.ArrowDown||keys.KeyS)move.sub(fwd);
  if(keys.ArrowRight||keys.KeyD)move.add(right);
  if(keys.ArrowLeft||keys.KeyA)move.sub(right);
  const moving=move.lengthSq()>0;
  if(moving){ move.normalize(); charPos.addScaledVector(move,SPEED*dt);
    charYaw=lerpAngle(charYaw,Math.atan2(move.x,move.z),Math.min(1,dt*9)); }

  updateFigure(elapsed, moving?1:0);
  figure.position.set(charPos.x, Math.sin(elapsed*1.6)*0.02, charPos.z);
  figure.rotation.y=charYaw; figure.rotation.z=Math.sin(elapsed*8)*0.04*(moving?1:0);

  up1.set(charPos.x, charPos.y+1.0, charPos.z);
  const head=tmp.set(charPos.x, charPos.y+1.45, charPos.z);
  const near=nearestFrame(charPos);
  let posLerp=6;

  if(mode===1){ // Curious Eye
    let tEl, tRad; const tgt=new THREE.Vector3();
    if(moving){ azimuth=lerpAngle(azimuth,charYaw,Math.min(1,dt*1.6)); tEl=0.16; tRad=4.2; tgt.copy(up1); }
    else if(near.d<5){ const k=1-near.d/5; tgt.copy(up1).lerp(near.f.position,0.4*k); tEl=0.34; tRad=2.8; }
    else { tEl=1.2; tRad=15; tgt.copy(up1); }
    camEl+=(tEl-camEl)*Math.min(1,dt*2); camRad+=(tRad-camRad)*Math.min(1,dt*2);
    lookT.lerp(tgt,Math.min(1,dt*2.5));
    desired.copy(orbit(azimuth,camEl,camRad,lookT));
  }
  else if(mode===2){ // Enter the Ghost
    if(keys.Space){ const p=(elevation-0.55); // pitch from drag
      const dir=tmp.set(Math.sin(azimuth)*Math.cos(p),Math.sin(p),Math.cos(azimuth)*Math.cos(p));
      desired.copy(head).addScaledVector(dir,0.05);
      lookT.copy(head).addScaledVector(dir,6); posLerp=9; bloom.strength=1.5;
    } else { camEl=elevation; camRad=4.4; lookT.lerp(up1,Math.min(1,dt*5));
      desired.copy(orbit(azimuth,elevation,4.4,up1)); bloom.strength=0.95; }
  }
  else if(mode===3){ // The Censer
    azimuth+=azVel*dt; elevation=Math.min(1.35,Math.max(0.08,elevation+elVel*dt));
    azVel-=azVel*Math.min(1,dt*1.4); elVel-=elVel*Math.min(1,dt*1.4);
    azVel+=Math.sin(elapsed*0.3)*0.02*dt; // faint living sway
    lookT.lerp(up1,Math.min(1,dt*5));
    desired.copy(orbit(azimuth,elevation,4.4,lookT));
  }
  else { // The Reveal
    let tEl,tRad; const tgt=new THREE.Vector3();
    if(near.d<5.5){ const rv=1-near.d/5.5;
      const azToArt=Math.atan2(charPos.x-near.f.position.x, charPos.z-near.f.position.z);
      azimuth=lerpAngle(azimuth,azToArt,Math.min(1,dt*2));
      tgt.copy(up1).lerp(near.f.position,rv*0.6); tEl=0.3; tRad=4.4-(4.4-2.6)*rv; posLerp=4;
    } else { tEl=0.42; tRad=4.4; tgt.copy(up1); }
    camEl+=(tEl-camEl)*Math.min(1,dt*3); camRad+=(tRad-camRad)*Math.min(1,dt*3);
    lookT.lerp(tgt,Math.min(1,dt*3));
    desired.copy(orbit(azimuth,camEl,camRad,lookT));
  }

  camera.position.lerp(desired,Math.min(1,dt*posLerp));
  camera.lookAt(lookT);

  // frames: art emerges from the dark as the ghost approaches (the "reveal")
  for(const f of frames){ const d=f.position.distanceTo(charPos); const g=Math.max(0,Math.min(1,(7-d)/7));
    f.userData.line.material.opacity=0.25+g*0.75;
    f.userData.panelMat.opacity=0.12+g*0.88; }

  composer.render();
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
